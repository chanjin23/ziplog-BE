spring:
  application:
    name: ziplog
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/ziplog}
    username: ${DB_USERNAME:ziplog}
    password: ${DB_PASSWORD:ziplog}
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
